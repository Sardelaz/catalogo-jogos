<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Catálogo de Jogos Gratuitos - Firestore + API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 550px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 20px;
        }

        input {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 16px;
            margin-right: 8px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        .item-jogo {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .imagem-jogo {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            display: block;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        #status {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
        }

        #botao-cancelar {
            display: none;
        }
    </style>
</head>

<body>

    <h1>Catálogo de Jogos Gratuitos — Firestore + GamerPower API</h1>
    <p id="status">Pronto.</p>

    <h3 id="titulo-formulario">Cadastrar novo jogo</h3>
    
    <!-- Campo oculto para guardar o ID quando estiver editando -->
    <input type="hidden" id="id-jogo">

    <input id="nome" placeholder="Nome do jogo (digite para buscar na API ou cadastrar)">
    <input id="genero" placeholder="Gênero (ex: Game, RPG, DLC)">
    <input id="plataforma" placeholder="Plataforma (ex: PC, Steam, Epic Games)">
    <input id="imagem" placeholder="URL da Imagem (https://...)">

    <button id="botao-salvar" onclick="salvarJogo()">Salvar no Firestore</button>
    <button id="botao-cancelar" onclick="cancelarEdicao()">Cancelar Edição</button>
    <button onclick="buscarNaApi()">Consultar API GamerPower</button>

    <h3>Jogos cadastrados no Firestore</h3>
    <button onclick="listarJogos()">Listar do Banco</button>
    <ul id="lista"></ul>

    <h3>Resultados da API GamerPower</h3>
    <ul id="lista-api"></ul>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7JtARNogSS7c0OmnzAIdX2qHF1TFIXmc",
            authDomain: "nuvem-sardela.firebaseapp.com",
            projectId: "nuvem-sardela",
            storageBucket: "nuvem-sardela.firebasestorage.app",
            messagingSenderId: "999690619793",
            appId: "1:999690619793:web:dca1bb526f8f99498ee830"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const status = document.getElementById("status");

        let jogosCarregados = {};

        window.buscarNaApi = async function () {
            const termoBusca = document.getElementById("nome").value.toLowerCase();
            const listaApi = document.getElementById("lista-api");
            listaApi.innerHTML = "";
            status.textContent = "Consultando API GamerPower...";

            const urlApi = "https://www.gamerpower.com/api/giveaways";

            try {
                let resposta;
                try {
                    resposta = await fetch(urlApi);
                    if (!resposta.ok) throw new Error("Falha no fetch direto");
                } catch (erroCors) {
                    resposta = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(urlApi));
                }

                const dados = await resposta.json();

                const jogosFiltrados = dados.filter((jogo) =>
                    jogo.title.toLowerCase().includes(termoBusca)
                ).slice(0, 10);

                if (jogosFiltrados.length === 0) {
                    status.textContent = "Nenhum jogo encontrado na API com esse nome.";
                    return;
                }

                const primeiro = jogosFiltrados[0];
                document.getElementById("nome").value = primeiro.title;
                document.getElementById("genero").value = primeiro.type;
                document.getElementById("plataforma").value = primeiro.platforms;
                document.getElementById("imagem").value = primeiro.thumbnail;

                // Exibe a lista de resultados da API
                jogosFiltrados.forEach((jogo) => {
                    const item = document.createElement("li");
                    item.className = "item-jogo";

                    const botaoPreencher = document.createElement("button");
                    botaoPreencher.textContent = "Preencher Formulário";
                    botaoPreencher.onclick = function () {
                        selecionarDaApi(jogo.title, jogo.type, jogo.platforms, jogo.thumbnail);
                    };

                    item.innerHTML = `
                        <img class="imagem-jogo" src="${jogo.thumbnail}" alt="${jogo.title}">
                        <strong>${jogo.title}</strong><br>
                        Gênero: ${jogo.type} | Plataforma: ${jogo.platforms}<br><br>
                    `;
                    item.appendChild(botaoPreencher);
                    listaApi.appendChild(item);
                });

                status.textContent = `${jogosFiltrados.length} jogo(s) encontrado(s) na API. O primeiro já preencheu o formulário!`;
            } catch (erro) {
                status.textContent = "Erro ao consultar API: " + erro.message;
                console.error(erro);
            }
        };

        window.selecionarDaApi = function (nome, genero, plataforma, imagem) {
            document.getElementById("nome").value = nome;
            document.getElementById("genero").value = genero;
            document.getElementById("plataforma").value = plataforma;
            document.getElementById("imagem").value = imagem;
            status.textContent = "Dados da API preenchidos no formulário!";
            window.scrollTo(0, 0);
        };

        window.salvarJogo = async function () {
            const idJogo = document.getElementById("id-jogo").value;
            const nome = document.getElementById("nome").value;
            const genero = document.getElementById("genero").value;
            const plataforma = document.getElementById("plataforma").value;
            const imagem = document.getElementById("imagem").value;

            if (!nome || !genero || !plataforma || !imagem) {
                status.textContent = "Preencha todos os campos antes de salvar.";
                return;
            }

            try {
                if (idJogo) {
                    status.textContent = "Atualizando jogo...";
                    const docRef = doc(db, "jogos", idJogo);
                    await updateDoc(docRef, { nome, genero, plataforma, imagem });
                    status.textContent = "Jogo atualizado com sucesso!";
                } else {
                    status.textContent = "Salvando novo jogo...";
                    await addDoc(collection(db, "jogos"), { nome, genero, plataforma, imagem });
                    status.textContent = "Jogo salvo com sucesso!";
                }

                cancelarEdicao();
                listarJogos();
            } catch (erro) {
                status.textContent = "Erro ao salvar: " + erro.message;
                console.error(erro);
            }
        };

        window.listarJogos = async function () {
            const lista = document.getElementById("lista");
            lista.innerHTML = "";
            jogosCarregados = {};
            status.textContent = "Carregando...";

            try {
                const querySnapshot = await getDocs(collection(db, "jogos"));
                querySnapshot.forEach((documento) => {
                    const d = documento.data();
                    const id = documento.id;
                    jogosCarregados[id] = d;

                    lista.innerHTML += `
                        <li class="item-jogo">
                            <img class="imagem-jogo" src="${d.imagem}" alt="${d.nome}">
                            <strong>${d.nome}</strong> — ${d.genero} — ${d.plataforma}<br><br>
                            <button onclick="prepararEdicao('${id}')">Editar</button>
                            <button onclick="apagarJogo('${id}')">Apagar</button>
                        </li>
                    `;
                });
                status.textContent = `${querySnapshot.size} jogo(s) carregado(s) do Firestore.`;
            } catch (erro) {
                status.textContent = "Erro ao listar: " + erro.message;
                console.error(erro);
            }
        };

        window.prepararEdicao = function (id) {
            const jogo = jogosCarregados[id];
            if (!jogo) return;

            document.getElementById("id-jogo").value = id;
            document.getElementById("nome").value = jogo.nome;
            document.getElementById("genero").value = jogo.genero;
            document.getElementById("plataforma").value = jogo.plataforma;
            document.getElementById("imagem").value = jogo.imagem;

            document.getElementById("titulo-formulario").textContent = "Editando jogo";
            document.getElementById("botao-salvar").textContent = "Atualizar Jogo";
            document.getElementById("botao-cancelar").style.display = "inline-block";

            status.textContent = "Altere os campos desejados e clique em 'Atualizar Jogo'.";
            window.scrollTo(0, 0);
        };

        window.cancelarEdicao = function () {
            document.getElementById("id-jogo").value = "";
            document.getElementById("nome").value = "";
            document.getElementById("genero").value = "";
            document.getElementById("plataforma").value = "";
            document.getElementById("imagem").value = "";

            document.getElementById("titulo-formulario").textContent = "Cadastrar novo jogo";
            document.getElementById("botao-salvar").textContent = "Salvar no Firestore";
            document.getElementById("botao-cancelar").style.display = "none";
        };

        window.apagarJogo = async function (id) {
            const confirmar = confirm("Tem certeza que deseja apagar este jogo?");
            if (!confirmar) return;

            try {
                const docRef = doc(db, "jogos", id);
                await deleteDoc(docRef);
                status.textContent = "Jogo apagado com sucesso.";
                
                if (document.getElementById("id-jogo").value === id) {
                    cancelarEdicao();
                }
                listarJogos();
            } catch (erro) {
                status.textContent = "Erro ao apagar: " + erro.message;
                console.error(erro);
            }
        };
    </script>

</body>

</html>
